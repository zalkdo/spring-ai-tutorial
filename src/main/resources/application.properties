spring.application.name=spring-ai-tutorial
#spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.port=8080

spring.ai.retry.max-attempts=5
spring.ai.retry.backoff.initial-interval=10000ms
spring.ai.retry.backoff.multiplier=5
spring.ai.retry.backoff.max-interval=600000ms

# OpenAI API Configuration
spring.ai.openai.api-key=key_L3VX9yH9eiwRVRKf
#${OPENAI_API_KEY}

# Google Gemini API Configuration
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY:}
#${GOOGLE_API_KEY}
spring.ai.google.genai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
#https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
#https://generativelanguage.googleapis.com/v1beta/openai

# File Upload Settings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
